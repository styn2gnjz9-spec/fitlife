  --muted: #8D8CA3;
  --effort: #FF0090;
  --recover: #00B4FF;
  --goal: #9D00FF;
  --fuel: #6A5CFF;
  --accent: #FF0090;
  --grad: linear-gradient(120deg, #00B4FF 0%, #9D00FF 55%, #FF0090 100%);
}
* { box-sizing: border-box; }
html, body { overflow-x: hidden; max-width: 100%; }
input, select, button { max-width: 100%; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Poppins', sans-serif;
}
.app-shell { min-height: 100vh; display: flex; position: relative; overflow-x: hidden; }
.app-shell.loading { align-items: center; justify-content: center; }
.loading-pulse { color: var(--muted); font-family: 'Space Mono', monospace; font-size: 13px; }
 
.ledger-rail {
  width: 14px; flex-shrink: 0; background: var(--surface); border-right: 1px solid var(--line);
  display: flex; flex-direction: column; justify-content: space-evenly; padding: 20px 0;
}
.ledger-tick-wrap { display: flex; justify-content: center; }
.ledger-tick { width: 5px; height: 5px; border-radius: 50%; background: var(--line); opacity: 0; animation: tickIn 0.4s ease forwards; }
.ledger-tick.on { background: var(--accent); }
@keyframes tickIn { to { opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .ledger-tick { animation: none; opacity: 1; } }
 
.app-main { flex: 1; min-width: 0; padding: 20px 18px 60px; max-width: 720px; margin: 0 auto; width: 100%; }
 
.hero { margin-bottom: 20px; position: relative; padding: 18px 20px 16px; border-radius: 16px; overflow: hidden; background: var(--surface); border: 1px solid var(--line); box-shadow: 0 1px 2px rgba(0,0,0,0.2), 0 10px 30px -18px rgba(157,0,255,0.35); }
.hero-mesh {
  position: absolute; inset: 0; z-index: 0; opacity: 0.16; pointer-events: none;
  background:
    radial-gradient(circle at 12% 15%, #00B4FF 0%, transparent 42%),
    radial-gradient(circle at 60% 0%, #9D00FF 0%, transparent 45%),
    radial-gradient(circle at 92% 60%, #FF0090 0%, transparent 48%);
  filter: blur(20px);
}
.hero-top { position: relative; z-index: 1; display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.hero-title-row { display: flex; align-items: center; gap: 12px; }
.app-mark {
  width: 32px; height: 32px; border-radius: 10px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center; color: #fff;
  background: var(--grad); font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 15px;
  box-shadow: inset 0 0 0 2px rgba(255,255,255,0.85);
}
.eyebrow { font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 0.06em; color: var(--muted); text-transform: uppercase; }
.hero h1 { font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 23px; letter-spacing: -0.01em; margin: 2px 0 0; color: var(--text); }
.hero-accent { font-weight: 600; background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
.pulse-svg { width: 100px; height: 30px; flex-shrink: 0; margin-top: 8px; position: relative; z-index: 1; }
 
.hero-stats { position: relative; z-index: 1; display: flex; gap: 24px; margin-top: 16px; flex-wrap: wrap; }
.stat-block { display: flex; flex-direction: column; }
.stat-value { font-family: 'Space Mono', monospace; font-size: 20px; font-weight: 600; color: var(--text); line-height: 1; }
.stat-unit { font-size: 12px; color: var(--muted); margin-left: 2px; }
.stat-label { font-size: 10.5px; color: var(--muted); margin-top: 4px; text-transform: uppercase; letter-spacing: 0.04em; }
 
.tabbar { display: flex; gap: 3px; margin-bottom: 18px; overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 4px; }
.tab {
  display: flex; align-items: center; gap: 6px; background: none; border: none; color: var(--muted);
  font-family: 'Poppins', sans-serif; font-size: 13px; font-weight: 500;
  padding: 8px 14px; cursor: pointer; white-space: nowrap; border-radius: 999px;
  transition: background 0.15s ease, color 0.15s ease;
}
.tab:hover { color: var(--text); }
.tab.active { color: #fff; background: var(--grad); box-shadow: 0 2px 10px -4px rgba(157,0,255,0.55); }
.tab:focus-visible, button:focus-visible, input:focus-visible { outline: 2px solid var(--recover); outline-offset: 2px; }
 
.content { padding-bottom: 20px; }
.dashboard-grid { display: grid; grid-template-columns: 1fr; gap: 14px; }
@media (min-width: 620px) { .dashboard-grid { grid-template-columns: 1fr 1fr; } }
.tab-body { display: flex; flex-direction: column; gap: 14px; }
 
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 18px; position: relative; overflow: hidden; box-shadow: 0 1px 2px rgba(0,0,0,0.2), 0 10px 24px -18px rgba(0,0,0,0.5); }
.panel::before { content: ""; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: var(--panel-accent, var(--fuel)); }
.panel-head { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
.panel-clickable { cursor: pointer; transition: transform 0.12s ease, border-color 0.15s ease; }
.panel-clickable:hover { border-color: var(--panel-accent, var(--fuel)); }
.panel-clickable:active { transform: scale(0.985); }
.panel-clickable:focus-visible { outline: 2px solid var(--recover); outline-offset: 2px; }
.panel-chevron { color: var(--muted); flex-shrink: 0; font-size: 18px; }
.panel-icon { width: 30px; height: 30px; border-radius: 10px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 15px; }
.panel h2 { font-family: 'Fredoka', sans-serif; font-size: 14.5px; font-weight: 600; letter-spacing: 0; margin: 0; color: var(--text); }
.panel-sub { font-size: 11px; color: var(--muted); margin: 1px 0 0; }
 
.empty-hint { color: var(--muted); font-size: 13px; line-height: 1.5; margin: 4px 0 0; }
 
.field { display: flex; flex-direction: column; gap: 5px; margin-bottom: 10px; font-size: 12px; color: var(--muted); }
.field input, .field select {
  background: var(--bg); border: 1px solid var(--line); color: var(--text);
  border-radius: 10px; padding: 8px 10px; font-family: 'Poppins', sans-serif; font-size: 14px;
  width: 100%; min-width: 0;
}
.field input[type="range"] { padding: 0; accent-color: var(--effort); }
.calc-field { color: var(--muted) !important; font-family: 'Space Mono', monospace; cursor: not-allowed; }
.quad-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 10px; }
 
.exercise-rows { display: flex; flex-direction: column; gap: 8px; margin-bottom: 10px; }
.exercise-row { display: grid; grid-template-columns: 2fr 1fr 1fr 1fr auto; gap: 6px; align-items: center; }
.exercise-row input { background: var(--bg); border: 1px solid var(--line); color: var(--text); border-radius: 8px; padding: 7px 8px; font-size: 13px; font-family: 'Space Mono', monospace; min-width: 0; }
.ex-name { font-family: 'Poppins', sans-serif !important; }
 
.row-actions { display: flex; gap: 8px; margin-top: 6px; flex-wrap: wrap; }
.ghost-btn, .primary-btn, .icon-btn {
  display: inline-flex; align-items: center; gap: 6px;
  font-family: 'Poppins', sans-serif; font-size: 13px; font-weight: 500;
  border-radius: 999px; cursor: pointer; border: 1px solid var(--line);
  padding: 9px 16px; background: transparent; color: var(--text);
}
.ghost-btn:hover { border-color: var(--muted); background: var(--bg); }
.primary-btn { background: var(--grad); border-color: transparent; color: #fff; font-weight: 600; box-shadow: 0 4px 16px -6px rgba(157,0,255,0.55); }
.primary-btn:hover { filter: brightness(1.05); }
.icon-btn { padding: 6px; border: none; color: var(--muted); border-radius: 999px; }
.icon-btn:hover { color: var(--effort); background: var(--bg); }
 
.history-list { display: flex; flex-direction: column; gap: 2px; }
.history-item { display: grid; grid-template-columns: 64px 1fr auto; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--line); }
.history-item:last-child { border-bottom: none; }
.history-date { font-family: 'Space Mono', monospace; font-size: 12px; color: var(--muted); }
.history-detail { font-size: 13px; overflow-wrap: break-word; word-break: break-word; min-width: 0; }
 
.fuel-summary { display: flex; gap: 24px; flex-wrap: wrap; }
.focus-text { font-size: 14px; line-height: 1.5; margin: 0; }
 
.toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: var(--text); color: #0B0C16; padding: 9px 16px; border-radius: 999px; font-size: 13px; font-family: 'Poppins', sans-serif; z-index: 50; box-shadow: 0 8px 24px -10px rgba(0,0,0,0.6); }
 
.full-span { grid-column: 1 / -1; }
.mini-list { margin: 0; padding-left: 18px; font-size: 13px; color: var(--text); display: flex; flex-direction: column; gap: 4px; }
.mini-list li { padding-left: 2px; }
 
.rings-row { display: flex; flex-direction: column; align-items: center; gap: 8px; flex-shrink: 0; }
.rings-svg { flex-shrink: 0; }
.rings-legend { display: flex; flex-direction: column; gap: 4px; align-items: flex-start; }
.rings-legend-item { display: flex; align-items: center; gap: 6px; }
.rings-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
.rings-legend-label { font-size: 10.5px; font-weight: 500; color: var(--text); font-family: 'Poppins', sans-serif; white-space: nowrap; }
 
.rings-panel-row { display: flex; align-items: center; gap: 16px; flex-wrap: nowrap; }
 
.week-heatmap { display: flex; flex-direction: column; gap: 8px; flex: 1; min-width: 0; }
.week-heatmap-title { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; font-family: 'Poppins', sans-serif; white-space: nowrap; }
.week-heatmap-grid { display: flex; gap: 4px; width: 100%; }
.week-heatmap-col { display: flex; flex-direction: column; align-items: center; gap: 5px; flex: 1; min-width: 0; }
.week-heatmap-cell { width: 100%; aspect-ratio: 1; max-width: 30px; border-radius: 5px; background: var(--line); }
.week-heatmap-cell.score-0 { background: rgba(255,255,255,0.07); }
.week-heatmap-cell.score-1 { background: rgba(0,180,255,0.35); }
.week-heatmap-cell.score-2 { background: rgba(157,0,255,0.55); }
.week-heatmap-cell.score-3 { background: var(--grad); }
.week-heatmap-cell.is-today { box-shadow: 0 0 0 2px rgba(255,255,255,0.6); }
.week-heatmap-cell.is-future { opacity: 0.3; }
.week-heatmap-label { font-size: 9px; color: var(--muted); font-family: 'Space Mono', monospace; }
 
.type-select { display: flex; gap: 4px; background: var(--bg); border: 1px solid var(--line); border-radius: 999px; padding: 3px; margin-bottom: 12px; width: fit-content; }
.type-btn { border: none; background: none; padding: 7px 14px; border-radius: 999px; cursor: pointer; font-family: 'Poppins', sans-serif; font-size: 12.5px; font-weight: 500; color: var(--muted); transition: background 0.15s ease, color 0.15s ease; }
.type-btn.active { background: var(--grad); color: #fff; }
 
.macro-bars { display: flex; flex-direction: column; gap: 12px; }
.macro-bar-head { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 5px; }
.macro-bar-value { font-family: 'Space Mono', monospace; color: var(--muted); }
.macro-bar-track { height: 7px; background: var(--bg); border-radius: 999px; overflow: hidden; }
.macro-bar-fill { height: 100%; border-radius: 999px; transition: width 0.4s ease; }
 
.mini-chart-svg { width: 100%; height: auto; display: block; }
 
::-webkit-scrollbar { height: 6px; width: 6px; }
::-webkit-scrollbar-thumb { background: var(--line); border-radius: 3px; }
</style>
</head>
<body>
<div id="root"></div>
<script>
setTimeout(function () {
  var root = document.getElementById('root');
  if (root && !root.hasChildNodes()) {
    root.innerHTML =
      '<pre style="white-space:pre-wrap;padding:20px;color:#f88;background:#1a0d16;font-family:monospace;font-size:13px;line-height:1.5;">' +
      'Nothing rendered after 6 seconds.\n\n' +
      'React loaded: ' + (typeof React !== 'undefined') + '\n' +
      'ReactDOM loaded: ' + (typeof ReactDOM !== 'undefined') + '\n' +
      'Babel loaded: ' + (typeof Babel !== 'undefined') +
      '</pre>';
  }
}, 6000);
</script>
<script type="text/babel" data-presets="react">
 
const { useState, useEffect, useCallback, useMemo, useRef } = React;
 
const storage = {
  async get(key) {
    const raw = window.localStorage.getItem(key);
    if (raw === null) throw new Error("not found");
    return { key, value: raw };
  },
  async set(key, value) {
    window.localStorage.setItem(key, value);
    return { key, value };
  },
};
 
const uid = () => Math.random().toString(36).slice(2, 10);
const dateKey = (d) => {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, "0");
  const day = String(d.getDate()).padStart(2, "0");
  return `${y}-${m}-${day}`;
};
const todayStr = () => dateKey(new Date());
const fmtDate = (d) => {
  const dt = new Date(d + "T00:00:00");
  return dt.toLocaleDateString(undefined, { month: "short", day: "numeric" });
};
const daysBetween = (a, b) => Math.round((new Date(b) - new Date(a)) / 86400000);
 
const EMPTY = {
  goals: {
    targetWeight: "", targetDate: "", startWeight: "", focus: "",
    stepGoal: "8000", weeklySessionGoal: "4", sleepGoal: "8",
    calorieGoal: "", proteinGoal: "", carbsGoal: "", fatGoal: "",
  },
  workouts: [], nutrition: [], sleep: [], weightLog: [],
};
 
function computeStreak(workouts, sleep, nutrition) {
  const daysWithActivity = new Set([
    ...workouts.map((w) => w.date), ...sleep.map((s) => s.date), ...nutrition.map((n) => n.date),
  ]);
  let streak = 0;
  let cursor = new Date();
  while (true) {
    const key = dateKey(cursor);
    if (daysWithActivity.has(key)) { streak += 1; cursor.setDate(cursor.getDate() - 1); } else break;
  }
  return streak;
}
 
const clampPct = (v) => (Number.isFinite(v) ? Math.max(0, Math.min(1, v)) : 0);
 
function weekSessionDayCount(workouts) {
  const days = new Set();
  const cursor = new Date();
  for (let i = 0; i < 7; i++) {
    const key = dateKey(cursor);
    if (workouts.some((w) => w.date === key)) days.add(key);
    cursor.setDate(cursor.getDate() - 1);
  }
  return days.size;
}
 
function todaysSteps(workouts) {
  const t = todayStr();
  return workouts.filter((w) => w.date === t && w.type === "walking").reduce((s, w) => s + Number(w.steps || 0), 0);
}
 
function last7DaysCompletion(data) {
  const days = [];
  const stepGoal = Number(data.goals.stepGoal || 0);
  const calorieGoal = Number(data.goals.calorieGoal || 0);
  const today = new Date();
  const todayKey = todayStr();
  const sunday = new Date(today);
  sunday.setDate(today.getDate() - today.getDay());
  const WEEKDAY_LETTERS = ["S", "M", "T", "W", "T", "F", "S"];
 
  for (let i = 0; i < 7; i++) {
    const dt = new Date(sunday);
    dt.setDate(sunday.getDate() + i);
    const key = dateKey(dt);
    const isFuture = key > todayKey;
    const stepsThatDay = data.workouts
      .filter((w) => w.date === key && w.type === "walking")
      .reduce((s, w) => s + Number(w.steps || 0), 0);
    const caloriesThatDay = data.nutrition
      .filter((n) => n.date === key)
      .reduce((s, n) => s + Number(n.calories || 0), 0);
    const stepsMet = stepGoal ? stepsThatDay >= stepGoal : stepsThatDay > 0;
    const trainingMet = data.workouts.some((w) => w.date === key);
    const fuelMet = calorieGoal ? caloriesThatDay >= calorieGoal * 0.85 : caloriesThatDay > 0;
    const score = isFuture ? 0 : [stepsMet, trainingMet, fuelMet].filter(Boolean).length;
    days.push({ date: key, label: WEEKDAY_LETTERS[i], score, isFuture });
  }
  return days;
}
 
function LedgerRail({ activeDates, span = 21 }) {
  const days = useMemo(() => {
    const arr = [];
    const d = new Date();
    for (let i = span - 1; i >= 0; i--) {
      const dt = new Date(d);
      dt.setDate(d.getDate() - i);
      arr.push(dateKey(dt));
    }
    return arr;
  }, [span]);
 
  return (
    <div className="ledger-rail" aria-hidden="true">
      {days.map((day, i) => {
        const on = activeDates.has(day);
        return (
          <div key={day} className="ledger-tick-wrap">
            <div className={`ledger-tick ${on ? "on" : ""}`} style={{ animationDelay: `${i * 18}ms` }} />
          </div>
        );
      })}
    </div>
  );
}
 
function PulseLine({ pct }) {
  const amp = 4 + pct * 14;
  const path = `M0,20 L60,20 L70,${20 - amp} L80,${20 + amp} L90,${20 - amp * 0.6} L100,20 L160,20`;
  return (
    <svg viewBox="0 0 160 40" className="pulse-svg" preserveAspectRatio="none">
      <path d={path} fill="none" stroke="var(--effort)" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round" />
    </svg>
  );
}
 
function GoalRings({ rings }) {
  const size = 140, center = size / 2, strokeW = 11, gap = 3;
  return (
    <div className="rings-row">
      <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`} className="rings-svg">
        {rings.map((r, i) => {
          const radius = center - strokeW / 2 - i * (strokeW + gap);
          const circumference = 2 * Math.PI * radius;
          const filled = clampPct(r.pct) * circumference;
          return (
            <g key={r.label} transform={`rotate(-90 ${center} ${center})`}>
              <circle cx={center} cy={center} r={radius} stroke="var(--line)" strokeWidth={strokeW} fill="none" />
              <circle cx={center} cy={center} r={radius} stroke={r.color} strokeWidth={strokeW} fill="none"
                strokeLinecap="round" strokeDasharray={`${filled} ${circumference}`}
                style={{ transition: "stroke-dasharray 0.6s ease" }} />
            </g>
          );
        })}
      </svg>
      <div className="rings-legend">
        {rings.map((r) => (
          <div className="rings-legend-item" key={r.label}>
            <span className="rings-dot" style={{ background: r.color }} />
            <div className="rings-legend-label">{r.label}</div>
          </div>
        ))}
      </div>
    </div>
  );
}
 
function WeekHeatmap({ days }) {
  const today = todayStr();
  return (
    <div className="week-heatmap">
      <div className="week-heatmap-title">This week</div>
      <div className="week-heatmap-grid">
        {days.map((d) => (
          <div className="week-heatmap-col" key={d.date}>
            <div
              className={`week-heatmap-cell score-${d.score} ${d.date === today ? "is-today" : ""} ${d.isFuture ? "is-future" : ""}`}
              title={`${d.date}: ${d.score}/3`}
            />
            <div className="week-heatmap-label">{d.label}</div>
          </div>
        ))}
      </div>
    </div>
  );
}
 
function MiniLineChart({ data, dataKey, color }) {
  if (data.length < 2) return null;
  const w = 600, h = 170, pad = 26;
  const values = data.map((d) => d[dataKey]);
  const min = Math.min(...values) - 2;
  const max = Math.max(...values) + 2;
  const xStep = (w - pad * 2) / (data.length - 1);
  const yFor = (v) => h - pad - ((v - min) / (max - min || 1)) * (h - pad * 2);
  const points = data.map((d, i) => [pad + i * xStep, yFor(d[dataKey])]);
  const path = points.map((p, i) => `${i === 0 ? "M" : "L"}${p[0]},${p[1]}`).join(" ");
  return (
    <svg viewBox={`0 0 ${w} ${h}`} className="mini-chart-svg" preserveAspectRatio="none">
      <line x1={pad} y1={h - pad} x2={w - pad} y2={h - pad} stroke="rgba(255,255,255,0.08)" strokeWidth="1" />
      <path d={path} fill="none" stroke={color} strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" />
      {points.map((p, i) => <circle key={i} cx={p[0]} cy={p[1]} r="3.5" fill={color} />)}
    </svg>
  );
}
 
function Section({ icon, title, sub, children, accentVar, onClick }) {
  return (
    <section
      className={`panel ${onClick ? "panel-clickable" : ""}`}
      style={{ "--panel-accent": `var(${accentVar})` }}
      onClick={onClick}
      role={onClick ? "button" : undefined}
      tabIndex={onClick ? 0 : undefined}
      onKeyDown={onClick ? (e) => { if (e.key === "Enter" || e.key === " ") onClick(); } : undefined}
    >
      <div className="panel-head">
        <div className="panel-icon" style={{ background: `var(${accentVar})1a` }}>{icon}</div>
        <div style={{ flex: 1 }}>
          <h2>{title}</h2>
          {sub && <p className="panel-sub">{sub}</p>}
        </div>
        {onClick && <span className="panel-chevron">›</span>}
      </div>
      {children}
    </section>
  );
}
 
function StatBlock({ label, value, unit, accentVar }) {
  return (
    <div className="stat-block">
      <div className="stat-value" style={accentVar ? { color: `var(${accentVar})` } : undefined}>
        {value}{unit && <span className="stat-unit">{unit}</span>}
      </div>
      <div className="stat-label">{label}</div>
    </div>
  );
}
 
function MacroBar({ label, value, goal, unit = "", color }) {
  const pct = clampPct(goal ? value / goal : 0) * 100;
  return (
    <div className="macro-bar">
      <div className="macro-bar-head">
        <span>{label}</span>
        <span className="macro-bar-value">{Math.round(value)}{unit} / {goal}{unit}</span>
      </div>
      <div className="macro-bar-track"><div className="macro-bar-fill" style={{ width: `${pct}%`, background: color }} /></div>
    </div>
  );
}
 
function EmptyHint({ text }) { return <p className="empty-hint">{text}</p>; }
 
const TABS = [
  { key: "dashboard", label: "Today", icon: "📈", accentVar: "--goal" },
  { key: "workout", label: "Train", icon: "🏋️", accentVar: "--effort" },
  { key: "nutrition", label: "Fuel", icon: "🍽️", accentVar: "--fuel" },
  { key: "sleep", label: "Sleep", icon: "🌙", accentVar: "--recover" },
  { key: "weight", label: "Weight", icon: "📈", accentVar: "--goal" },
  { key: "goals", label: "Goal", icon: "🎯", accentVar: "--goal" },
];
 
function Header({ streak, goals, latestWeight, todayCompletion }) {
  const toGoDays = goals.targetDate ? daysBetween(todayStr(), goals.targetDate) : null;
  const toGoWeight = latestWeight && goals.targetWeight ? (Number(latestWeight) - Number(goals.targetWeight)).toFixed(1) : null;
  return (
    <header className="hero">
      <div className="hero-mesh" aria-hidden="true" />
      <div className="hero-top">
        <div className="hero-title-row">
          <div className="app-mark">F</div>
          <div>
            <div className="eyebrow">{new Date().toLocaleDateString(undefined, { weekday: "long", month: "long", day: "numeric", year: "numeric" })}</div>
            <h1>Fit<span className="hero-accent">life</span></h1>
          </div>
        </div>
        <PulseLine pct={todayCompletion} />
      </div>
      <div className="hero-stats">
        <StatBlock label="day streak" value={streak} accentVar="--accent" />
        <StatBlock label="current" value={latestWeight ?? "—"} unit={latestWeight ? " lb" : ""} accentVar="--recover" />
        {toGoWeight !== null && (
          <StatBlock label={Number(toGoWeight) > 0 ? "lb to goal" : "past goal"} value={Math.abs(toGoWeight)} accentVar="--effort" />
        )}
        {toGoDays !== null && toGoDays >= 0 && <StatBlock label="days left" value={toGoDays} accentVar="--fuel" />}
      </div>
    </header>
  );
}
 
function Dashboard({ data, latestWeight, onNavigate }) {
  const chartData = useMemo(() => {
    const sorted = [...data.weightLog].sort((a, b) => (a.date < b.date ? -1 : 1));
    return sorted.map((w) => ({ date: fmtDate(w.date), weight: Number(w.weight) }));
  }, [data.weightLog]);
 
  const t = todayStr();
  const todaysWorkout = data.workouts.filter((w) => w.date === t);
  const todaysNutrition = data.nutrition.filter((n) => n.date === t);
  const todaysSleep = data.sleep.find((s) => s.date === t);
 
  const strengthCount = todaysWorkout.filter((w) => (w.type || "strength") === "strength").length;
  const conditioningCount = todaysWorkout.filter((w) => w.type === "conditioning").length;
  const stepsToday = todaysSteps(data.workouts);
  const caloriesToday = todaysNutrition.reduce((s, n) => s + Number(n.calories || 0), 0);
  const sessionDays = weekSessionDayCount(data.workouts);
 
  const stepGoal = Number(data.goals.stepGoal || 0);
  const sessionGoal = Number(data.goals.weeklySessionGoal || 0);
  const calorieGoal = Number(data.goals.calorieGoal || 0);
  const sleepGoal = Number(data.goals.sleepGoal || 0);
  const sleepHours = todaysSleep ? Number(todaysSleep.hours || 0) : 0;
 
  const startWeightNum = Number(data.goals.startWeight || 0);
  const targetWeightNum = Number(data.goals.targetWeight || 0);
  const currentWeightNum = Number(latestWeight || 0);
  const hasWeightGoal = startWeightNum && targetWeightNum && startWeightNum !== targetWeightNum;
  const weightProgressPct = hasWeightGoal
    ? Math.abs(startWeightNum - currentWeightNum) / Math.abs(startWeightNum - targetWeightNum)
    : 0;
 
  const rings = [
    { label: "Steps", pct: stepGoal ? stepsToday / stepGoal : 0, color: "#00B4FF", detail: stepGoal ? `${stepsToday.toLocaleString()} / ${stepGoal.toLocaleString()}` : "Set a step goal" },
    { label: "Fuel", pct: calorieGoal ? caloriesToday / calorieGoal : 0, color: "#9D00FF", detail: calorieGoal ? `${caloriesToday.toLocaleString()} / ${calorieGoal.toLocaleString()} kcal` : "Set a calorie goal" },
    { label: "Sleep", pct: sleepGoal ? sleepHours / sleepGoal : 0, color: "#6A5CFF", detail: sleepGoal ? `${sleepHours || 0}h / ${sleepGoal}h` : "Set a sleep goal" },
  ];
 
  return (
    <div className="dashboard-grid">
      <div className="full-span">
        <Section icon="🎯" title="Today's rings" sub="Steps · Fuel · Sleep" accentVar="--goal">
          <div className="rings-panel-row">
            <GoalRings rings={rings} />
            <WeekHeatmap days={last7DaysCompletion(data)} />
          </div>
        </Section>
      </div>
 
      <Section icon="📈" title="Weight trend" sub={`${data.weightLog.length} entries logged`} accentVar="--goal" onClick={() => onNavigate("weight")}>
        {chartData.length > 1 ? <MiniLineChart data={chartData} dataKey="weight" color="#00B4FF" /> : <EmptyHint text="Log two or more weigh-ins to see your trend line here." />}
      </Section>
 
      <Section icon="🏋️" title="Today's training" accentVar="--effort" onClick={() => onNavigate("workout")}>
        {todaysWorkout.length ? (
          <ul className="mini-list">
            {strengthCount > 0 && <li>{strengthCount} strength session{strengthCount !== 1 ? "s" : ""}</li>}
            {conditioningCount > 0 && <li>{conditioningCount} CrossFit / conditioning session{conditioningCount !== 1 ? "s" : ""}</li>}
            {stepsToday > 0 && <li>{stepsToday.toLocaleString()} steps walked</li>}
          </ul>
        ) : <EmptyHint text="Nothing logged yet today. Head to Train to add a session." />}
      </Section>
 
      <Section icon="🍽️" title="Today's fuel" accentVar="--fuel" onClick={() => onNavigate("nutrition")}>
        {todaysNutrition.length ? (
          <div className="fuel-summary">
            <StatBlock label="calories" value={caloriesToday} accentVar="--fuel" />
            <StatBlock label="protein" value={todaysNutrition.reduce((s, n) => s + Number(n.protein || 0), 0)} unit="g" />
            <StatBlock label="carbs" value={todaysNutrition.reduce((s, n) => s + Number(n.carbs || 0), 0)} unit="g" />
            <StatBlock label="fat" value={todaysNutrition.reduce((s, n) => s + Number(n.fat || 0), 0)} unit="g" />
          </div>
        ) : <EmptyHint text="No meals logged today." />}
      </Section>
 
      <Section icon="🌙" title="Last night" accentVar="--recover" onClick={() => onNavigate("sleep")}>
        {todaysSleep ? <StatBlock label="hours slept" value={todaysSleep.hours} unit="h" accentVar="--recover" /> : <EmptyHint text="No sleep logged for last night yet." />}
      </Section>
    </div>
  );
}
 
const WORKOUT_TYPES = [
  { key: "strength", label: "Strength" },
  { key: "conditioning", label: "CrossFit" },
  { key: "walking", label: "Walking" },
];
 
function WorkoutTab({ workouts, onChange }) {
  const [type, setType] = useState("strength");
  const [date, setDate] = useState(todayStr());
  const [exercises, setExercises] = useState([{ id: uid(), name: "", sets: "", reps: "", weight: "" }]);
  const [wod, setWod] = useState({ name: "", format: "For time", score: "", notes: "" });
  const [walk, setWalk] = useState({ steps: "", distance: "", duration: "" });
 
  const addRow = () => setExercises((e) => [...e, { id: uid(), name: "", sets: "", reps: "", weight: "" }]);
  const updateRow = (id, field, val) => setExercises((e) => e.map((r) => (r.id === id ? { ...r, [field]: val } : r)));
  const removeRow = (id) => setExercises((e) => e.filter((r) => r.id !== id));
 
  const save = () => {
    if (type === "strength") {
      const cleaned = exercises.filter((r) => r.name.trim());
      if (!cleaned.length) return;
      onChange([{ id: uid(), date, type, exercises: cleaned }, ...workouts]);
      setExercises([{ id: uid(), name: "", sets: "", reps: "", weight: "" }]);
    } else if (type === "conditioning") {
      if (!wod.name.trim() && !wod.score.trim()) return;
      onChange([{ id: uid(), date, type, ...wod }, ...workouts]);
      setWod({ name: "", format: "For time", score: "", notes: "" });
    } else {
      if (!walk.steps) return;
      onChange([{ id: uid(), date, type, ...walk }, ...workouts]);
      setWalk({ steps: "", distance: "", duration: "" });
    }
  };
 
  const sorted = [...workouts].sort((a, b) => (a.date < b.date ? 1 : -1));
 
  const describeEntry = (w) => {
    const wType = w.type || "strength";
    if (wType === "strength") return w.exercises.map((e) => `${e.name} ${e.sets ? e.sets + "×" + e.reps : ""}${e.weight ? " @ " + e.weight + "lb" : ""}`).join(" · ");
    if (wType === "conditioning") return `${w.name || "WOD"}${w.format ? " · " + w.format : ""}${w.score ? " · " + w.score : ""}`;
    return `${Number(w.steps || 0).toLocaleString()} steps${w.distance ? " · " + w.distance + " mi" : ""}${w.duration ? " · " + w.duration + " min" : ""}`;
  };
 
  return (
    <div className="tab-body">
      <Section icon="🏋️" title="Log a session" accentVar="--effort">
        <div className="type-select">
          {WORKOUT_TYPES.map((t) => (
            <button key={t.key} className={`type-btn ${type === t.key ? "active" : ""}`} onClick={() => setType(t.key)}>{t.label}</button>
          ))}
        </div>
 
        <label className="field"><span>Date</span><input type="date" value={date} onChange={(e) => setDate(e.target.value)} /></label>
 
        {type === "strength" && (
          <>
            <div className="exercise-rows">
              {exercises.map((r) => (
                <div className="exercise-row" key={r.id}>
                  <input placeholder="Exercise" value={r.name} onChange={(e) => updateRow(r.id, "name", e.target.value)} className="ex-name" />
                  <input placeholder="Sets" inputMode="numeric" value={r.sets} onChange={(e) => updateRow(r.id, "sets", e.target.value)} />
                  <input placeholder="Reps" inputMode="numeric" value={r.reps} onChange={(e) => updateRow(r.id, "reps", e.target.value)} />
                  <input placeholder="Lb" inputMode="numeric" value={r.weight} onChange={(e) => updateRow(r.id, "weight", e.target.value)} />
                  <button className="icon-btn" onClick={() => removeRow(r.id)} aria-label="Remove exercise">🗑️</button>
                </div>
              ))}
            </div>
            <div className="row-actions"><button className="ghost-btn" onClick={addRow}>+ Add exercise</button></div>
          </>
        )}
 
        {type === "conditioning" && (
          <>
            <label className="field"><span>Workout name</span><input placeholder="Fran, Murph, custom WOD…" value={wod.name} onChange={(e) => setWod((f) => ({ ...f, name: e.target.value }))} /></label>
            <label className="field">
              <span>Format</span>
              <select value={wod.format} onChange={(e) => setWod((f) => ({ ...f, format: e.target.value }))}>
                <option>For time</option><option>AMRAP</option><option>EMOM</option><option>Rounds + reps</option>
              </select>
            </label>
            <label className="field"><span>Score</span><input placeholder="12:34, 5 rounds + 10, etc." value={wod.score} onChange={(e) => setWod((f) => ({ ...f, score: e.target.value }))} /></label>
            <label className="field"><span>Notes</span><input placeholder="RX, scaled weight, how it felt…" value={wod.notes} onChange={(e) => setWod((f) => ({ ...f, notes: e.target.value }))} /></label>
          </>
        )}
 
        {type === "walking" && (
          <div className="quad-grid">
            <label className="field"><span>Steps</span><input inputMode="numeric" placeholder="6000" value={walk.steps} onChange={(e) => setWalk((f) => ({ ...f, steps: e.target.value }))} /></label>
            <label className="field"><span>Distance (mi)</span><input inputMode="decimal" placeholder="2.5" value={walk.distance} onChange={(e) => setWalk((f) => ({ ...f, distance: e.target.value }))} /></label>
            <label className="field"><span>Duration (min)</span><input inputMode="numeric" placeholder="30" value={walk.duration} onChange={(e) => setWalk((f) => ({ ...f, duration: e.target.value }))} /></label>
          </div>
        )}
 
        <div className="row-actions"><button className="primary-btn" onClick={save}>✓ Save session</button></div>
      </Section>
 
      <Section icon="🏋️" title="History" sub={`${workouts.length} sessions`} accentVar="--effort">
        {sorted.length ? (
          <div className="history-list">
            {sorted.map((w) => (
              <div className="history-item" key={w.id}>
                <div className="history-date">{fmtDate(w.date)}</div>
                <div className="history-detail">{describeEntry(w)}</div>
                <button className="icon-btn" onClick={() => onChange(workouts.filter((x) => x.id !== w.id))} aria-label="Delete">🗑️</button>
              </div>
            ))}
          </div>
        ) : <EmptyHint text="No sessions logged yet." />}
      </Section>
    </div>
  );
}
 
function NutritionTab({ entries, goals, onChange }) {
  const [form, setForm] = useState({ date: todayStr(), meal: "", protein: "", carbs: "", fat: "" });
  const set = (k, v) => setForm((f) => ({ ...f, [k]: v }));
  const computedCalories = Math.round(Number(form.protein || 0) * 4 + Number(form.carbs || 0) * 4 + Number(form.fat || 0) * 9);
 
  const save = () => {
    if (!computedCalories && !form.meal) return;
    onChange([{ id: uid(), ...form, calories: computedCalories }, ...entries]);
    setForm({ date: todayStr(), meal: "", protein: "", carbs: "", fat: "" });
  };
 
  const sorted = [...entries].sort((a, b) => (a.date < b.date ? 1 : -1));
  const t = todayStr();
  const todays = entries.filter((n) => n.date === t);
  const totals = {
    calories: todays.reduce((s, n) => s + Number(n.calories || 0), 0),
    protein: todays.reduce((s, n) => s + Number(n.protein || 0), 0),
    carbs: todays.reduce((s, n) => s + Number(n.carbs || 0), 0),
    fat: todays.reduce((s, n) => s + Number(n.fat || 0), 0),
  };
  const hasTargets = goals && (goals.calorieGoal || goals.proteinGoal || goals.carbsGoal || goals.fatGoal);
 
  return (
    <div className="tab-body">
      {hasTargets && (
        <Section icon="🍽️" title="Today's macros" sub="vs. your daily targets" accentVar="--fuel">
          <div className="macro-bars">
            {goals.calorieGoal && <MacroBar label="Calories" value={totals.calories} goal={Number(goals.calorieGoal)} color="#6A5CFF" />}
            {goals.proteinGoal && <MacroBar label="Protein" value={totals.protein} goal={Number(goals.proteinGoal)} unit="g" color="#FF0090" />}
            {goals.carbsGoal && <MacroBar label="Carbs" value={totals.carbs} goal={Number(goals.carbsGoal)} unit="g" color="#9D00FF" />}
            {goals.fatGoal && <MacroBar label="Fat" value={totals.fat} goal={Number(goals.fatGoal)} unit="g" color="#00B4FF" />}
          </div>
        </Section>
      )}
 
      <Section icon="🍽️" title="Log a meal" accentVar="--fuel">
        <label className="field"><span>Date</span><input type="date" value={form.date} onChange={(e) => set("date", e.target.value)} /></label>
        <label className="field"><span>Meal / notes</span><input placeholder="Chicken & rice bowl" value={form.meal} onChange={(e) => set("meal", e.target.value)} /></label>
        <div className="quad-grid">
          <label className="field"><span>Protein g</span><input inputMode="numeric" value={form.protein} onChange={(e) => set("protein", e.target.value)} /></label>
          <label className="field"><span>Carbs g</span><input inputMode="numeric" value={form.carbs} onChange={(e) => set("carbs", e.target.value)} /></label>
          <label className="field"><span>Fat g</span><input inputMode="numeric" value={form.fat} onChange={(e) => set("fat", e.target.value)} /></label>
          <label className="field"><span>Calories (auto)</span><input value={computedCalories ? `${computedCalories} kcal` : ""} disabled className="calc-field" /></label>
        </div>
        <div className="row-actions"><button className="primary-btn" onClick={save}>✓ Save meal</button></div>
      </Section>
 
      <Section icon="🍽️" title="History" sub={`${entries.length} meals logged`} accentVar="--fuel">
        {sorted.length ? (
          <div className="history-list">
            {sorted.map((n) => (
              <div className="history-item" key={n.id}>
                <div className="history-date">{fmtDate(n.date)}</div>
                <div className="history-detail">{n.meal || "Meal"} {n.calories ? `· ${n.calories} kcal` : ""} {n.protein ? `· ${n.protein}g protein` : ""}</div>
                <button className="icon-btn" onClick={() => onChange(entries.filter((x) => x.id !== n.id))} aria-label="Delete">🗑️</button>
              </div>
            ))}
          </div>
        ) : <EmptyHint text="No meals logged yet." />}
      </Section>
    </div>
  );
}

function WeightTab({ entries, goals, onChange }) {

    if (!form.weight) return;
    onChange([{ id: uid(), ...form }, ...entries]);
    setForm({ date: todayStr(), weight: "", bodyFat: "" });

  const sorted = [...entries].sort((a, b) => (a.date < b.date ? 1 : -1));
 
  const bodyFatChartData = useMemo(() => {
    return [...entries]
      .filter((w) => w.bodyFat)
      .sort((a, b) => (a.date < b.date ? -1 : 1))

        </div>
        <input
          ref={fileInputRef}
          type="file"
          accept="application/json"
          style={{ display: "none" }}
          onChange={(e) => {
            const file = e.target.files && e.target.files[0];
            if (file) onImport(file);
            e.target.value = "";
          }}
        />
      </Section>
    </div>
  );
}
 
function FitnessTracker() {
  const [data, setData] = useState(EMPTY);
  const [loaded, setLoaded] = useState(false);
  const [tab, setTab] = useState("dashboard");
  const [toast, setToast] = useState(null);
  const saveTimer = useRef(null);
 
  useEffect(() => {
    (async () => {
      try {
        const res = await storage.get("fitness-data");
        if (res && res.value) setData({ ...EMPTY, ...JSON.parse(res.value) });
      } catch (e) {
        // no existing data yet
      } finally {
        setLoaded(true);
      }
    })();
  }, []);
 
  const persist = useCallback((next) => {
    setData(next);
    if (saveTimer.current) clearTimeout(saveTimer.current);
    saveTimer.current = setTimeout(async () => {
      try {
        await storage.set("fitness-data", JSON.stringify(next));
      } catch (e) {
        setToast("Couldn't save — try again");
      }
    }, 250);
  }, []);
 
  const exportData = useCallback(() => {
    try {
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `fitlife-backup-${todayStr()}.json`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
      setToast("Backup downloaded");
    } catch (e) {
      setToast("Couldn't export — try again");
    }
  }, [data]);
 
  const importData = useCallback(
    (file) => {
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const parsed = JSON.parse(reader.result);
          if (typeof parsed !== "object" || parsed === null) throw new Error("bad shape");
          const merged = {
            goals: { ...EMPTY.goals, ...(parsed.goals || {}) },
            workouts: Array.isArray(parsed.workouts) ? parsed.workouts : [],
            nutrition: Array.isArray(parsed.nutrition) ? parsed.nutrition : [],
            sleep: Array.isArray(parsed.sleep) ? parsed.sleep : [],
            weightLog: Array.isArray(parsed.weightLog) ? parsed.weightLog : [],
          };
          persist(merged);
          setToast("Backup restored");
        } catch (e) {
          setToast("That file didn't look like a Fitlife backup");
        }
      };
      reader.onerror = () => setToast("Couldn't read that file");
      reader.readAsText(file);
    },
    [persist]
  );
 
  useEffect(() => {
    if (!toast) return;
    const t = setTimeout(() => setToast(null), 2400);
    return () => clearTimeout(t);
  }, [toast]);
 
  const activeDates = useMemo(() => new Set([
    ...data.workouts.map((w) => w.date), ...data.sleep.map((s) => s.date),
    ...data.nutrition.map((n) => n.date), ...data.weightLog.map((w) => w.date),
  ]), [data]);
 
  const streak = useMemo(() => computeStreak(data.workouts, data.sleep, data.nutrition), [data]);
  const latestWeight = data.weightLog.length
    ? [...data.weightLog].sort((a, b) => (a.date < b.date ? 1 : -1))[0].weight
    : data.goals.startWeight || null;
 
  const todayCompletion = useMemo(() => {
    const t = todayStr();
    let n = 0;
    if (data.workouts.some((w) => w.date === t)) n++;
    if (data.sleep.some((s) => s.date === t)) n++;
    if (data.nutrition.some((x) => x.date === t)) n++;
    if (data.weightLog.some((w) => w.date === t)) n++;
    return n / 4;
  }, [data]);
 
  if (!loaded) {
    return <div className="app-shell loading"><div className="loading-pulse">Loading your log…</div></div>;
  }
 
  return (
    <div className="app-shell">
      <LedgerRail activeDates={activeDates} />
      <div className="app-main">
        <Header streak={streak} goals={data.goals} latestWeight={latestWeight} todayCompletion={todayCompletion} />
        <nav className="tabbar">
          {TABS.map((t) => (
            <button key={t.key} className={`tab ${tab === t.key ? "active" : ""}`} onClick={() => setTab(t.key)}>
              <span>{t.icon}</span>{t.label}
            </button>
          ))}
        </nav>
        <main className="content">
          {tab === "dashboard" && <Dashboard data={data} latestWeight={latestWeight} onNavigate={setTab} />}
          {tab === "workout" && <WorkoutTab workouts={data.workouts} onChange={(w) => persist({ ...data, workouts: w })} />}
          {tab === "nutrition" && <NutritionTab entries={data.nutrition} goals={data.goals} onChange={(n) => persist({ ...data, nutrition: n })} />}
          {tab === "sleep" && <SleepTab entries={data.sleep} onChange={(s) => persist({ ...data, sleep: s })} />}
          {tab === "weight" && <WeightTab entries={data.weightLog} goals={data.goals} onChange={(w) => persist({ ...data, weightLog: w })} />}
          {tab === "goals" && <GoalsTab goals={data.goals} onChange={(g) => persist({ ...data, goals: g })} onExport={exportData} onImport={importData} />}
        </main>
      </div>
      {toast && <div className="toast">{toast}</div>}
    </div>
  );
}
 
ReactDOM.createRoot(document.getElementById("root")).render(<FitnessTracker />);
</script>
</body>
</html>
